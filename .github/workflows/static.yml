# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static content
        run: |
          uv run make -C sites/landing html
          uv run make -C sites/site-a html
          uv run make -C sites/site-b html
          rm -rf build
          mkdir -p build/site-a build/site-b
          cp -R sites/landing/build/html/. build/
          cp -R sites/site-a/build/html/. build/site-a/
          cp -R sites/site-b/build/html/. build/site-b/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload staged Pages output
          path: 'build/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
